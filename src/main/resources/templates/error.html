<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina('Error', 'error', ~{::contenido}, ~{})}">
<body>
<th:block th:fragment="contenido">
    <div class="mx-auto mt-10 max-w-md text-center">
        <span class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-aviso/15 text-aviso-texto">
            <th:block th:replace="~{fragments/iconos :: alerta('h-9 w-9')}"/>
        </span>
        <h1 class="mt-5 "
            th:text="${status == 404} ? 'No encontramos esa página' : (${status == 403} ? 'Sin permiso' : 'Algo salió mal')">
            Algo salió mal</h1>
        <p class="mt-2 text-secundario" th:if="${mensaje}" th:text="${mensaje}"></p>
        <a th:href="@{/}" class="btn btn-primary mt-6">Volver al inicio</a>
    </div>
</th:block>
</body>
</html>
