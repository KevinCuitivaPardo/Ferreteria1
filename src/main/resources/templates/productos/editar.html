<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina('Editar producto', 'inventario', ~{::contenido}, ~{})}">
<body>
<th:block th:fragment="contenido">
    <div class="mx-auto max-w-2xl">
        <a th:href="@{/Productos}" class="btn btn-ghost btn-sm mb-3 -ml-3">
            <th:block th:replace="~{fragments/iconos :: flecha-izquierda('h-4 w-4')}"/>Inventario</a>
        <h1 class="mb-5">Editar producto</h1>

        <form method="post" th:action="@{/Editar/{id}(id=${producto.id})}" th:object="${producto}"
              class="card card-body space-y-5">
            <div>
                <label for="codigo" class="label">Código</label>
                <input id="codigo" th:field="*{codigo}" class="input" required/>
            </div>

            <div>
                <label for="nombre" class="label">Nombre</label>
                <input id="nombre" th:field="*{nombre}" class="input" required/>
            </div>

            <div>
                <label for="medida" class="label">Medida</label>
                <input id="medida" th:field="*{medida}" class="input"/>
            </div>

            <div>
                <label for="precioCompra" class="label">Precio de compra (x100 und)</label>
                <input id="precioCompra" th:field="*{precioCompra}" type="number" step="0.01" min="0" class="input"/>
                <p class="ayuda">
                    Precio de venta automático (compra × 2):
                    <strong th:text="${@formato.moneda(producto.precioVentaAutomatico)}"></strong>
                </p>
            </div>

            <div>
                <label for="stockMinimo" class="label">Stock mínimo</label>
                <input id="stockMinimo" th:field="*{stockMinimo}" type="number" min="0" class="input"/>
                <p class="ayuda">El stock se modifica desde la pantalla de Movimientos.</p>
            </div>

            <div class="flex flex-wrap gap-3 pt-1">
                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                <a th:href="@{/Productos}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</th:block>
</body>
</html>
