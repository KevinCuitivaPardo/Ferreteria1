spring.application.name=ferreteria
server.port=${PORT:5107}

# Base de datos: por defecto la de docker-compose.yml (docker compose up -d)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ferreteria}
spring.datasource.username=${DB_USER:ferreteria}
spring.datasource.password=${DB_PASSWORD:ferreteria}

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
server.servlet.session.timeout=12h

# Administrador que se crea solo si la tabla usuarios está vacía (cámbialo en producción)
ferreteria.primer-admin.usuario=${ADMIN_USUARIO:admin}
ferreteria.primer-admin.clave=${ADMIN_CLAVE:admin123}

# Migraciones de base de datos. Una base creada antes de Flyway se toma como versión 1.
# Los datos de ejemplo (db/demo) solo para desarrollo: en producción usa FLYWAY_LOCATIONS=classpath:db/migration
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/demo}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Mapas: Nominatim (OpenStreetMap) para ubicar direcciones. La política de uso pide identificarse.
ferreteria.geocodificador.url=${GEOCODIFICADOR_URL:https://nominatim.openstreetmap.org}
ferreteria.geocodificador.pais=${GEOCODIFICADOR_PAIS:co}
ferreteria.geocodificador.contacto=${GEOCODIFICADOR_CONTACTO:ferreteria-app}

# Fotos de las entregas: carpeta donde se guardan los archivos y tamaño máximo de subida
ferreteria.fotos.directorio=${FOTOS_DIRECTORIO:datos/fotos}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
