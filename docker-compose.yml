# Base de datos de desarrollo:  docker compose up -d
# El esquema lo crea la aplicación al arrancar (migraciones Flyway en src/main/resources/db).
# Para empezar de cero:         docker compose down -v && docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: ferreteria-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ferreteria}
      POSTGRES_USER: ${DB_USER:-ferreteria}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ferreteria}
      TZ: America/Bogota
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - ferreteria-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ferreteria} -d ${DB_NAME:-ferreteria}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ferreteria-datos:
